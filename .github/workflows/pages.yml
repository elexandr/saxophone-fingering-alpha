name: Pages

# Публикация сайта через Actions. Лимит "10 сборок в час" к таким публикациям
# не применяется, и виден журнал сборки - если что-то падает, это видно текстом.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Забрать файлы
        uses: actions/checkout@v4

      - name: Подготовить Pages
        uses: actions/configure-pages@v5

      - name: Собрать артефакт
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Опубликовать
        id: deployment
        uses: actions/deploy-pages@v4